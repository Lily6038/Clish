plugins {
	id 'fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
	version = project.mod_version
	group = project.maven_group
}

repositories {
	maven {
		url = "https://maven.parchmentmc.org"
	}
}

loom {
	accessWidenerPath = file('src/main/resources/clish.aw')
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered {
		officialMojangMappings {
			nameSyntheticMembers = true
		}
		parchment("org.parchmentmc.data:parchment-${project.parchment_mcversion}:${project.parchment_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Optional dependencies (uncomment as needed)
	// include modImplementation("dev.xpple:clientarguments:${project.clientarguments_version}")
	// include modImplementation("dev.xpple:betterconfig-fabric:${project.betterconfig_version}")

	compileOnly 'com.demonwav.mcdev:annotations:2.0.0'
}

processResources {
	inputs.property "version", project.version
	inputs.property "mcversion", project.minecraft_version_dependency

	duplicatesStrategy DuplicatesStrategy.WARN

	from(sourceSets.main.resources.srcDirs) {
		include "fabric.mod.json"
		expand "version": project.version, "mcversion": project.minecraft_version_dependency
	}

	from(sourceSets.main.resources.srcDirs) {
		exclude "fabric.mod.json"
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

// Run tasks are auto-generated by Fabric Loom:
// ./gradlew runClient - runs the development client
// ./gradlew genSourcesWithVineflower - downloads Minecraft sources
